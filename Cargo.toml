[package]
name = "axum-tokio"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = {version = "0.13.4", features = ["json"]}
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "runtime-tokio-rustls"] }
dotenv = "0.15"
